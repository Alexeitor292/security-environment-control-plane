    # image pinning cannot remove. The job body therefore runs inside a digest-pinned container
    # whose `/etc` comes from a content-addressed image layer and is root-owned by construction.
    # `attest_trusted_ancestry.py` is byte-for-byte unchanged and runs INSIDE this container (its
    # `os.lstat` is namespace-relative, so it observes this environment's ancestry), and it still
    # exits 78 before any product test if that environment is invalid. Nothing here relaxes,
    # repairs, special-cases, skips or warns through a non-root-owned ancestor.
    # The pin is mirrored in `infra/ci/controlled-root-env.json`; the agreement is machine-checked
    # by `tests/test_trusted_ancestry_isolation.py`.
    container:
      image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
      # `--init` runs a real init as PID 1 so orphaned processes are REAPED. Without it the first
      # CI run of this environment failed `backend-deployment-root`'s
      # test_timeout_proves_full_group_disappearance_no_orphan with `command_group_not_terminated`:
      # a GitHub `container:` job's PID 1 does not reap, so after the runner's bounded
      # SIGTERM -> grace -> SIGKILL sequence the killed grandchild stayed a ZOMBIE, `killpg(pgid, 0)`
      # kept succeeding, and the runner could not prove the group had disappeared. That was the
      # fence WORKING — it refused rather than reporting a termination it had not proven — and the
      # defect was in this environment definition, which was missing a property every real machine
      # has. It is not a relaxation: the runner's proof obligation is unchanged, and nothing here
      # grants a capability, mounts a host path, or touches the ancestry the gate attests.
      # Declared once in `infra/ci/controlled-root-env.json` and machine-checked against every copy.
      options: --init
    env:
      SECP_APP_ENV: test
    steps:
      - name: Record the controlled environment's pristine ancestry posture
        # The first thing that happens in this job, before any third-party action runs inside the
        # container. Bounded, non-secret metadata for the two components every root fence depends
        # on. This is EVIDENCE, not a gate: the classified gate below is the only thing that decides
        # the job. It exists so a future posture change is attributable to the pinned image rather
        # than to something that ran after it.
        run: |
          stat -c '%u %g %n' / /etc
      - name: Install the controlled environment prerequisites
        # The pinned base is minimal. Install exactly what this job needs and nothing else: sudo (so
        # every root command keeps its reviewed `sudo` form even though the container is already
        # uid 0), ca-certificates + curl (uv and its managed CPython fetch over HTTPS), git (so
        # actions/checkout performs a real clone rather than a REST fallback), and the archive tools
        # the toolchain unpacks with. No package repairs, chowns or chmods a system directory.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends sudo ca-certificates curl git tar xz-utils
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Prepare a genuinely root-only trusted base directory
        run: |
          sudo mkdir -p /root/secp-mgmt-roottest
          sudo chown root:root /root/secp-mgmt-roottest
          sudo chmod 700 /root/secp-mgmt-roottest
      - name: Fail-closed ancestor-chain trust preflight
        # Every component of SECP_ROOT_TEST_DIR must be a real dir, root-owned, non-symlink, with no
        # group/other write — exit nonzero on any failure (never print-and-continue).
        run: |
          sudo env "SECP_ROOT_TEST_DIR=/root/secp-mgmt-roottest" "$(pwd)/.venv/bin/python" - <<'PY'
          import os, stat, sys
          base = os.environ["SECP_ROOT_TEST_DIR"]
          if not os.path.isabs(base):
              print("::error::SECP_ROOT_TEST_DIR must be an absolute path")
              sys.exit(1)
          parts = [p for p in base.split("/") if p]
          chain = ["/"] + ["/" + "/".join(parts[: i + 1]) for i in range(len(parts))]
          problems = []
          for comp in chain:
              try:
                  st = os.lstat(comp)
              except OSError as exc:
                  problems.append(f"{comp}: not statable (errno {exc.errno})")
                  continue
              mode = st.st_mode
              if stat.S_ISLNK(mode):
                  problems.append(f"{comp}: is a symlink")
                  continue
              if not stat.S_ISDIR(mode):
                  problems.append(f"{comp}: not a real directory")
                  continue
              if st.st_uid != 0:
                  problems.append(f"{comp}: uid={st.st_uid} (not root-owned)")
              perm = stat.S_IMODE(mode)
              if perm & 0o020:
                  problems.append(f"{comp}: group-writable (mode {oct(perm)})")
              if perm & 0o002:
                  problems.append(f"{comp}: other-writable (mode {oct(perm)})")
          if problems:
              for pr in problems:
                  print(f"::error::untrusted ancestor {pr}")
              sys.exit(1)
          print(f"ancestor chain trusted: {chain}")
          PY
      - name: Attest trusted ancestry (infrastructure_invalid, never a product failure)
        # SECP-PR5H-B2A reliability gate. `RealFilesystem._open_parent` fstat-verifies every ancestor
        # to be a real, root-owned, non-group/other-writable directory. That rule is NOT relaxed
        # here and an unexpected posture is NEVER repaired. This step only makes a violation
        # ATTRIBUTABLE and correctly CLASSIFIED: it captures bounded stat evidence for each ancestor
        # the fence will traverse and exits 78 (infrastructure_invalid) before any product test runs,
        # so "this machine is invalid" can never again be mistaken for "the feature is broken" and
        # answered with a blind re-run.
        run: |
          sudo "$(pwd)/.venv/bin/python" infra/ci/attest_trusted_ancestry.py /etc/secp/controller /var/lib/secp
      - name: Run management-plane root-security tests as root (no skips)
        run: >-
          sudo env "SECP_ROOT_TEST_DIR=/root/secp-mgmt-roottest" "$(pwd)/.venv/bin/python" -m pytest
          apps/management/tests/test_management_root.py
          -q -p no:cacheprovider
          --junitxml=junit-management-root.xml
      - name: Upload management root JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-management-root
          path: junit-management-root.xml
          if-no-files-found: error
      - name: Enforce the management root-security tests actually executed as root (no skips)
        if: always()
        run: |
          "$(pwd)/.venv/bin/python" - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("junit-management-root.xml")
          if not p.exists():
              print("::error::junit-management-root.xml missing — the root test step produced no results")
              sys.exit(1)
          root = ET.parse(p).getroot()
          tests = failures = errors = skipped = 0
          for s in root.iter("testsuite"):
              tests += int(s.get("tests", 0))
              failures += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
          print(f"collected={tests} failures={failures} errors={errors} skipped={skipped}")
          problems = []
          if tests < 3:
              problems.append(f"expected >= 3 management root tests, collected {tests}")
          if skipped != 0:
              problems.append(f"expected 0 skipped, got {skipped} (root-security tests NOT executed as root)")
          if failures != 0:
              problems.append(f"{failures} failing management root test(s)")
          if errors != 0:
              problems.append(f"{errors} errored management root test(s)")
          if problems:
              for pr in problems:
                  print(f"::error::{pr}")
              sys.exit(1)
          print("Management root-security tests executed as root: >= 3 tests, zero skipped/failed/errored.")
          PY

  # --- Real management adapters executed against REAL Docker + systemd, AS ROOT ----------------
  # The hermetic management tests exercise the real leaves through recording runners; this job runs
  # the ACTUAL RealWorkerBootstrapAdapter / RealManagementHostObserver / RealManagementRollbackAdapter
  # through the pinned RealCommandRunner + hardened RealFilesystem against disposable real containers
  # and a real DISABLED+STOPPED operator unit: image load + loaded-digest verification (right loads /
  # wrong refuses), operator present+disabled+stopped, ordinary observed running+healthy with an
  # opaque marker, status reobservation, partial-bootstrap compensation with zero residual, exact
  # rollback, idempotent retry. FAILS CLOSED by parsing the JUnit (a fully-skipped or non-executing
  # run can never pass). It enables/starts no operator, submits no workflow, and contacts no provider
  # or OpenTofu. (The full 8-service controller stack + real migration are the follow-on 4b job.)
  backend-management-real-adapters-root:
    name: Management real adapters E2E (root, real Docker + systemd)
    # TIER-2 HOLDOUT — still on the nondeterministic hosted VM, and its green is therefore still a
    # coin flip. This fence depends on the machine's `/etc` ancestry being root:root, and SECP-WSA
    # showed that is nondeterministic PER VM, not per image: in run 30522895412 sibling jobs of the
    # SAME run, on the SAME `ImageVersion 20260726.254.1`, observed `/etc` uid=1001 and uid=0.
    # An earlier revision of this comment claimed pinning makes a recurrence "attributable to a
    # specific image rather than to 'some runner'". That claim is FALSE and is withdrawn. The pin is
    # kept because it still removes silent image rollover as one variable, but it is not what would
    # make this fence's result meaningful.
    # It cannot move into the controlled environment yet: it drives real systemd units and a real
    # container runtime, and a GitHub `container:` job has no init system and no daemon. Doing so
    # needs a job-constructed privileged environment — an operator decision, escalated in
    # `infra/ci/FOLLOWUP-controlled-runner.md`, not assumed here. Nothing here relaxes the check.
    # `tests/test_trusted_ancestry_isolation.py` names this job in `NOT_YET_CONTROLLED`, and that
    # set is machine-checked against both this workflow and `infra/ci/controlled-root-env.json`, so
    # the gap cannot be forgotten and a third fence cannot be quietly parked alongside it.
    runs-on: ubuntu-24.04
    env:
      SECP_APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Verify real Docker daemon + systemd + pinned binaries are present
        # The runner ships a live Docker daemon and systemd as PID 1; the adapters pin the real
        # root-owned docker/systemctl binaries. Pre-pull the disposable images so the timed adapter
        # steps never race a registry pull. Fail fast if any prerequisite is missing.
        run: |
          docker version
          systemctl --version | head -1
          test -f /usr/bin/docker && test -f /usr/bin/systemctl
          docker pull hello-world:latest
          docker pull busybox:latest
      - name: Prepare a genuinely root-only trusted base directory
        # The hardened filesystem refuses to write unless EVERY ancestor is root-owned and not
        # group/other-writable; /opt on the runner has a world-writable ancestor, so the sandbox
        # layout roots live under a fresh root:root tree beneath /root (whose chain is trusted).
        run: |
          sudo mkdir -p /root/secp-mgmt-real
          sudo chown root:root /root/secp-mgmt-real
          sudo chmod 0755 /root/secp-mgmt-real
      - name: Attest trusted ancestry (infrastructure_invalid, never a product failure)
        # SECP-PR5H-B2A reliability gate. `RealFilesystem._open_parent` fstat-verifies every ancestor
        # to be a real, root-owned, non-group/other-writable directory. That rule is NOT relaxed
        # here and an unexpected posture is NEVER repaired. This step only makes a violation
        # ATTRIBUTABLE and correctly CLASSIFIED: it captures bounded stat evidence for each ancestor
        # the fence will traverse and exits 78 (infrastructure_invalid) before any product test runs,
        # so "this machine is invalid" can never again be mistaken for "the feature is broken" and
        # answered with a blind re-run.
        run: |
          sudo "$(pwd)/.venv/bin/python" infra/ci/attest_trusted_ancestry.py /etc/systemd/system /etc/secp/controller
      - name: Run the real management adapter E2E as root (no skips)
        # Absolute venv interpreter under passwordless sudo (effective UID 0) so the pinned runner's
        # root-owned executable + hardened root-owned filesystem requirements are satisfied and the
        # operator unit is installed into the real /etc/systemd/system. SECP_ROOT_TEST_DIR is a
        # root-owned, non-group/other-writable ancestor for the sandbox layout roots.
        run: >-
          sudo env "SECP_ROOT_TEST_DIR=/root/secp-mgmt-real" "$(pwd)/.venv/bin/python" -m pytest
          apps/management/tests/test_management_real_adapters_root.py
          -q -p no:cacheprovider
          --junitxml=junit-management-real-adapters-root.xml
      - name: Upload management real-adapter JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-management-real-adapters-root
          path: junit-management-real-adapters-root.xml
          if-no-files-found: error
      - name: Enforce the real adapters actually executed against real infra (no skips)
        if: always()
        # Parse the JUnit programmatically — do NOT trust pytest's exit code, since a fully-skipped
        # module exits 0. Green only if >= 5 tests ran and none were skipped/failed/errored.
        run: |
          "$(pwd)/.venv/bin/python" - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("junit-management-real-adapters-root.xml")
          if not p.exists():
              print("::error::junit-management-real-adapters-root.xml missing — no results produced")
              sys.exit(1)
          root = ET.parse(p).getroot()
          tests = failures = errors = skipped = 0
          for s in root.iter("testsuite"):
              tests += int(s.get("tests", 0))
              failures += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
          print(f"collected={tests} failures={failures} errors={errors} skipped={skipped}")
          problems = []
          if tests < 5:
              problems.append(f"expected >= 5 real-adapter E2E tests, collected {tests}")
          if skipped != 0:
              problems.append(f"expected 0 skipped, got {skipped} (real adapters NOT executed against real infra)")
          if failures != 0:
              problems.append(f"{failures} failing real-adapter E2E test(s)")
          if errors != 0:
              problems.append(f"{errors} errored real-adapter E2E test(s)")
          if problems:
              for pr in problems:
                  print(f"::error::{pr}")
              sys.exit(1)
          print("Real management adapters executed against real Docker + systemd: >= 5 tests, zero skipped/failed/errored.")
          PY

