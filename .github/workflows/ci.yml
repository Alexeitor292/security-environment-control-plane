name: CI

# Required CI runs once per PR (pull_request) and on main pushes — never a duplicate
# feature-branch push run. Manual re-runs via workflow_dispatch. No path filtering: every PR
# gets the complete required gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Group by PR number (so new pushes to the same PR cancel superseded runs) while keeping main
# distinct. Valid GitHub Actions expression syntax.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --- fast static signal: format, lint, types, schema, boundary --------------------------------
  backend-static:
    name: Backend static (format, lint, types, schema, boundary)
    runs-on: ubuntu-latest
    env:
      SECP_APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Format check (ruff)
        run: uv run ruff format --check apps contracts plugins scripts tests
      - name: Lint (ruff)
        run: uv run ruff check apps contracts plugins scripts tests
      - name: Type check (mypy)
        run: >-
          uv run mypy
          apps/api/secp_api
          apps/worker/secp_worker
          apps/commissioning/secp_commissioning
          apps/deployment/secp_operator_deployment
          apps/deployment/secp_discovery_activation
          apps/management/secp_management
          contracts
          plugins
      - name: Schema validation (web-breach-101)
        run: |
          uv run python - <<'PY'
          import yaml
          from secp_scenario_schema import validate_definition
          validate_definition(yaml.safe_load(open("docs/scenarios/web-breach-101.yaml")))
          print("web-breach-101 is valid against the schema")
          PY
      - name: Architecture boundary checks (fast duplicate signal)
        # Also covered by the sharded corpus; run here as an early architectural signal.
        run: >-
          uv run pytest
          tests/test_architecture_boundary.py
          tests/test_pr5f_discovery_activation_boundary.py
          -q

  # --- machine-enforced complete-coverage proof ------------------------------------------------
  backend-test-inventory:
    name: Backend test inventory (complete-coverage proof)
    runs-on: ubuntu-latest
    env:
      SECP_APP_ENV: test
      # Identical environment to the shard jobs so canonical vs. sharded collection match exactly.
      SECP_TEST_POSTGRES_URL: postgresql+psycopg://secp:secp@localhost:5432/secptest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secp
          POSTGRES_PASSWORD: secp
          POSTGRES_DB: secptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secp -d secptest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Sharding planner/verifier unit tests
        run: uv run pytest tests/test_pytest_shards.py tests/test_ci_workflow.py -q
      - name: Prove sharded corpus == canonical corpus (node-level)
        run: uv run python scripts/ci/pytest_shards.py verify --collect

  # --- complete pytest corpus, balanced across parallel shards, real PostgreSQL per shard -------
  backend-pytest:
    name: Backend pytest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SECP_APP_ENV: test
      SECP_TEST_POSTGRES_URL: postgresql+psycopg://secp:secp@localhost:5432/secptest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secp
          POSTGRES_PASSWORD: secp
          POSTGRES_DB: secptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secp -d secptest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        # `worker` is installed HERE and only here. `temporalio` lives solely in that extra, and
        # every install site in this workflow used `.[dev]`, so eight tests across
        # test_temporal_sandbox_validation.py, test_worker_fail_closed.py and
        # test_worker_readiness_timing.py hit `pytest.importorskip("temporalio")` and SKIPPED in
        # CI while passing on any developer machine — including a fail-closed worker guard and the
        # regression for a startup-fatal import bug. This is the only job that EXECUTES the shared
        # corpus, so it is the narrowest placement that makes all eight actually run; the eleven
        # other install sites are deliberately left on `.[dev]`.
        # It does not move the corpus: every `importorskip` is inside a test body, so all eight
        # nodes were already COLLECTED either way and `backend-test-inventory`'s canonical-vs-
        # sharded proof is unaffected.
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev,worker]"
      - name: Prove the worker extra is actually present (no silent re-skip)
        # Without this, reverting the line above to `.[dev]` would silently restore the skip: the
        # shard jobs have no no-skip enforcement, so eight tests would go back to reading as
        # passing while ungated and nothing would say so. The import is the whole check.
        run: |
          uv run python -c "import temporalio; print('temporalio', temporalio.__file__)"
      - name: Show shard assignment
        run: uv run python scripts/ci/pytest_shards.py plan
      - name: Run shard ${{ matrix.shard }} (real PostgreSQL, complete slice, no early exit)
        run: >-
          uv run python scripts/ci/pytest_shards.py run --shard ${{ matrix.shard }}
          -- -q -p no:cacheprovider --durations=15
          --junitxml=junit-shard-${{ matrix.shard }}.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-shard-${{ matrix.shard }}
          path: junit-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # --- PR5F PostgreSQL finalization fence, dedicated no-skip transaction proof ----------------
  # The normal shards include this module, but this additive gate proves the real PostgreSQL named
  # constraint and release/rollback transaction semantics cannot disappear behind a skip. It runs
  # only against the ephemeral job-local database and contacts no deployment infrastructure.
  backend-pr5f-postgres-finalization:
    name: PR5F PostgreSQL finalization fence (real DB, no skips)
    runs-on: ubuntu-latest
    env:
      SECP_APP_ENV: test
      SECP_TEST_POSTGRES_URL: postgresql+psycopg://secp:secp@localhost:5432/secptest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secp
          POSTGRES_PASSWORD: secp
          POSTGRES_DB: secptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secp -d secptest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Run the real PostgreSQL PR5F fence transaction proof
        run: >-
          uv run pytest
          apps/api/tests/test_discovery_activation_rollback_migration_postgres.py
          -q -p no:cacheprovider
          --junitxml=junit-pr5f-postgres-finalization.xml
      - name: Upload PR5F PostgreSQL JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-pr5f-postgres-finalization
          path: junit-pr5f-postgres-finalization.xml
          if-no-files-found: error
      - name: Enforce the PostgreSQL finalization proof actually executed (no skips)
        if: always()
        run: |
          "$(pwd)/.venv/bin/python" - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("junit-pr5f-postgres-finalization.xml")
          if not path.exists():
              print("::error::PR5F PostgreSQL JUnit missing — the test step produced no results")
              sys.exit(1)
          root = ET.parse(path).getroot()
          tests = failures = errors = skipped = 0
          for suite in root.iter("testsuite"):
              tests += int(suite.get("tests", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"collected={tests} failures={failures} errors={errors} skipped={skipped}")
          problems = []
          if tests < 1:
              problems.append(f"expected >= 1 PR5F PostgreSQL test, collected {tests}")
          if skipped != 0:
              problems.append(f"expected 0 skipped, got {skipped} (real fence proof did not run)")
          if failures != 0:
              problems.append(f"{failures} failing PR5F PostgreSQL test(s)")
          if errors != 0:
              problems.append(f"{errors} errored PR5F PostgreSQL test(s)")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print("PR5F PostgreSQL fence proof executed: >= 1 test, zero skipped/failed/errored.")
          PY

  # --- PR5H-A PostgreSQL enrollment/recovery fence, dedicated no-skip proof ---------------------
  # The normal shards already collect these modules, but they SKIP without a database. This additive
  # gate proves the durable enrollment repository, the transactional CAS/nonce concurrency suite, the
  # restart/crash recovery suite and the real migration round trip all EXECUTE against a real
  # PostgreSQL, and that the live Alembic head is exactly a1d4f7c2e9b6. It runs only against the
  # ephemeral job-local database and contacts no deployment infrastructure.
  backend-pr5h-postgres-enrollment:
    name: PR5H-A PostgreSQL enrollment/recovery fence (real DB, no skips)
    runs-on: ubuntu-latest
    env:
      SECP_APP_ENV: test
      SECP_TEST_POSTGRES_URL: postgresql+psycopg://secp:secp@localhost:5432/secptest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secp
          POSTGRES_PASSWORD: secp
          POSTGRES_DB: secptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secp -d secptest"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Run the real PostgreSQL enrollment, recovery and migration proofs
        run: >-
          uv run pytest
          apps/api/tests/test_worker_enrollment_postgres.py
          apps/api/tests/test_worker_enrollment_recovery_postgres.py
          apps/api/tests/test_worker_enrollment_migration_postgres.py
          apps/api/tests/test_enrollment_signer_lease_postgres.py
          apps/api/tests/test_enrollment_signer_scram_postgres.py
          apps/api/tests/test_enrollment_signer_provision_postgres.py
          apps/api/tests/test_activate_controller_identity_once_postgres.py
          apps/management/tests/test_controller_finalization_postgres.py
          -q -p no:cacheprovider
          --junitxml=junit-pr5h-postgres-enrollment.xml
      - name: Upload PR5H-A PostgreSQL JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-pr5h-postgres-enrollment
          path: junit-pr5h-postgres-enrollment.xml
          if-no-files-found: error
      - name: Enforce the PR5H-A PostgreSQL proofs actually executed (no skips)
        if: always()
        run: |
          "$(pwd)/.venv/bin/python" - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          # 27 repository/concurrency + 15 restart/crash recovery + 4 real-migration proofs
          # (the F5 idempotent-creation + F3 controller-identity-rotation regressions, plus the two
          # PR5H-B1 Phase 3 signed-offer proofs: write-once single-winner + tamper-refusal-on-load),
          # + 6 PR5H-B1 C4 least-privilege signer-lease proofs (real secp_enrollment_signer role:
          # advisory-lock lease succeeds, rotation serializes behind it, unrelated read + identity
          # writes refuse, role is not superuser/owner),
          # + 5 PR5H-B2 2b-2 SCRAM dedicated-role provisioning proofs (locally-computed SCRAM verifier
          # authenticates against real PostgreSQL, wrong password rejected, provisioned role is exactly
          # least-privilege, role flags closed, provisioning idempotent),
          # + 9 PR5H-B2 C4 provisioning one-shot + hostile-repair proofs (one-shot creates role +
          # SCRAM plaintext authenticates, wrong plaintext rejected, credential rotation invalidates
          # the old plaintext, role exactly least-privilege, attributes closed incl NOINHERIT +
          # NOREPLICATION, SET ROLE refused + RESET cannot reveal admin, memberships repaired both
          # directions, sequence/function privileges stripped, owned object refused not silently kept),
          # + 8 PR5H-B2 C3 activation durable-idempotency proofs (first execution commits identity +
          # receipt atomically, exact replay byte-equivalent after freshness expiry, a missed initial
          # lookup replays via the locked authoritative re-read, a new operation id and a mismatched
          # operation-digest still conflict under that re-read, tampered receipt refuses state-corrupt,
          # genuine concurrent same-operation is a single winner via the advisory lock with no raw
          # IntegrityError, the write-once receipt table is unreachable by the least-privilege role),
          # + 4 PR5H-B2 2b-3b-iii finalization dedicated-role proofs (build_signer_role_engine
          # authenticates + pins UTC + takes the advisory lock, wrong plaintext rejected, the
          # management ACTIVE-identity reobservation returns the exact facts, identity writes refuse).
          EXPECTED_MINIMUM = 78
          path = Path("junit-pr5h-postgres-enrollment.xml")
          if not path.exists():
              print("::error::PR5H-A PostgreSQL JUnit missing - the test step produced no results")
              sys.exit(1)
          root = ET.parse(path).getroot()
          tests = failures = errors = skipped = 0
          for suite in root.iter("testsuite"):
              tests += int(suite.get("tests", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"collected={tests} failures={failures} errors={errors} skipped={skipped}")
          problems = []
          if tests < EXPECTED_MINIMUM:
              problems.append(
                  f"expected >= {EXPECTED_MINIMUM} PR5H-A PostgreSQL tests, collected {tests}"
              )
          if skipped != 0:
              problems.append(
                  f"expected 0 skipped, got {skipped} - PostgreSQL was unavailable, so the"
                  " enrollment/recovery proofs did not actually run"
              )
          if failures != 0:
              problems.append(f"{failures} failing PR5H-A PostgreSQL test(s)")
          if errors != 0:
              problems.append(f"{errors} errored PR5H-A PostgreSQL test(s)")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(
              f"PR5H-A PostgreSQL proofs executed: {tests} tests, zero skipped/failed/errored."
          )
          PY
      - name: Prove the live Alembic head is exactly a1d4f7c2e9b6
        run: |
          uv run python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          url = os.environ["SECP_TEST_POSTGRES_URL"]
          engine = create_engine(url, future=True)
          with engine.connect() as conn:
              rows = conn.execute(text("SELECT version_num FROM alembic_version")).scalars().all()
          engine.dispose()
          if rows != ["a1d4f7c2e9b6"]:
              print(f"::error::live Alembic head is {rows}, expected exactly ['a1d4f7c2e9b6']")
              sys.exit(1)
          print("live Alembic head verified: a1d4f7c2e9b6")
          PY

  # --- dependency/security scan ----------------------------------------------------------------
  backend-security:
    name: Backend security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Dependency/security scan (pip-audit)
        run: uv run pip-audit --skip-editable

  # --- production RealFilesystem backend, executed AS ROOT -------------------------------------
  # The hardened POSIX backend (openat / O_NOFOLLOW / root-owned-ancestor walk / transactional
  # makedir) REFUSES to operate unless every ancestor is root-owned, so the normal, non-root shards
  # SKIP `test_commissioning_realfs.py` entirely — and a fully-skipped module still exits 0. This
  # dedicated job runs that module under passwordless sudo (effective UID 0) so the production
  # implementation actually executes, then FAILS CLOSED by parsing the JUnit: it is green only if
  # the module truly ran (>= 8 collected, zero skipped / failed / errored). The pytest exit code
  # alone is NOT trusted, because an all-skipped run exits successfully.
  backend-realfs-root:
    name: Backend RealFilesystem (root, production openat backend)
    # The hosted VM only HOSTS this job now; the fence executes inside the controlled environment
    # declared below. `runs-on` stays pinned so the host side is still a known quantity.
    runs-on: ubuntu-24.04
    # SECP-WSA tier 1 — the controlled environment. The trusted-ancestor requirement is unchanged;
    # what changes is WHERE it is proven. The hosted VM's `/etc` ownership is nondeterministic: in
    # run 30522895412 one job observed `/etc` uid=1001 gid=1001 while two sibling jobs of the SAME
    # run, on the SAME `ImageVersion 20260726.254.1`, observed uid=0. That is per-VM variance, which
    # image pinning cannot remove. The job body therefore runs inside a digest-pinned container
    # whose `/etc` comes from a content-addressed image layer and is root-owned by construction.
    # `attest_trusted_ancestry.py` is byte-for-byte unchanged and runs INSIDE this container (its
    # `os.lstat` is namespace-relative, so it observes this environment's ancestry), and it still
    # exits 78 before any product test if that environment is invalid. Nothing here relaxes,
    # repairs, special-cases, skips or warns through a non-root-owned ancestor.
    # The pin is mirrored in `infra/ci/controlled-root-env.json`; the agreement is machine-checked
    # by `tests/test_trusted_ancestry_isolation.py`.
    container:
      image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
      # `--init` runs a real init as PID 1 so orphaned processes are REAPED. Without it the first
      # CI run of this environment failed `backend-deployment-root`'s
      # test_timeout_proves_full_group_disappearance_no_orphan with `command_group_not_terminated`:
      # a GitHub `container:` job's PID 1 does not reap, so after the runner's bounded
      # SIGTERM -> grace -> SIGKILL sequence the killed grandchild stayed a ZOMBIE, `killpg(pgid, 0)`
      # kept succeeding, and the runner could not prove the group had disappeared. That was the
      # fence WORKING — it refused rather than reporting a termination it had not proven — and the
      # defect was in this environment definition, which was missing a property every real machine
      # has. It is not a relaxation: the runner's proof obligation is unchanged, and nothing here
      # grants a capability, mounts a host path, or touches the ancestry the gate attests.
      # Declared once in `infra/ci/controlled-root-env.json` and machine-checked against every copy.
      options: --init
    env:
      SECP_APP_ENV: test
    steps:
      - name: Record the controlled environment's pristine ancestry posture
        # The first thing that happens in this job, before any third-party action runs inside the
        # container. Bounded, non-secret metadata for the two components every root fence depends
        # on. This is EVIDENCE, not a gate: the classified gate below is the only thing that decides
        # the job. It exists so that a future posture change is attributable to the pinned image
        # rather than to something that ran after it — the question the old step ordering (first
        # observation only after checkout and setup-uv) could not answer.
        run: |
          stat -c '%u %g %n' / /etc
      - name: Install the controlled environment prerequisites
        # The pinned base is minimal. Install exactly what this job needs and nothing else: sudo (so
        # every root command keeps its reviewed `sudo` form even though the container is already
        # uid 0), ca-certificates + curl (uv and its managed CPython fetch over HTTPS), git (so
        # actions/checkout performs a real clone rather than a REST fallback), and the archive tools
        # the toolchain unpacks with. No package repairs, chowns or chmods a system directory.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends sudo ca-certificates curl git tar xz-utils
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Create venv and install project
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Attest trusted ancestry (infrastructure_invalid, never a product failure)
        # This module builds its sandbox directly beneath `/` (test_commissioning_realfs.py:26), so
        # `/` IS the complete ancestry the production openat backend will traverse here. Until now
        # this was the one root-elevated fence with no attestation gate: an untrusted `/` would have
        # surfaced as errored product tests — "the feature is broken" — instead of a classified
        # invalid machine. The rule is not relaxed and the posture is never repaired.
        run: |
          sudo "$(pwd)/.venv/bin/python" infra/ci/attest_trusted_ancestry.py /
      - name: Run production RealFilesystem tests as root
        # Absolute venv interpreter under passwordless sudo, so effective UID 0 satisfies the
        # backend's root-owned-ancestor requirement and the tests build a root-owned sandbox
        # beneath `/` (cleaned up by each test). No deployment infrastructure is contacted.
        run: >-
          sudo "$(pwd)/.venv/bin/python" -m pytest
          apps/commissioning/tests/test_commissioning_realfs.py
          -q -p no:cacheprovider
          --junitxml=junit-realfs-root.xml
      - name: Upload RealFilesystem JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-realfs-root
          path: junit-realfs-root.xml
          if-no-files-found: error
      - name: Enforce the production backend actually executed as root (no skips)
        if: always()
        # Parse the JUnit programmatically — do NOT trust pytest's exit code, since a fully-skipped
        # module exits 0. Fail unless >= 8 tests were collected and none were skipped/failed/errored.
        run: |
          "$(pwd)/.venv/bin/python" - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("junit-realfs-root.xml")
          if not p.exists():
              print("::error::junit-realfs-root.xml missing — the root test step produced no results")
              sys.exit(1)
          root = ET.parse(p).getroot()
          tests = failures = errors = skipped = 0
          for s in root.iter("testsuite"):
              tests += int(s.get("tests", 0))
              failures += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
          print(f"collected={tests} failures={failures} errors={errors} skipped={skipped}")
          problems = []
          if tests < 8:
              problems.append(f"expected >= 8 RealFilesystem tests, collected {tests}")
          if skipped != 0:
              problems.append(f"expected 0 skipped, got {skipped} (production backend NOT executed as root)")
          if failures != 0:
              problems.append(f"{failures} failing RealFilesystem test(s)")
          if errors != 0:
              problems.append(f"{errors} errored RealFilesystem test(s)")
          if problems:
              for pr in problems:
                  print(f"::error::{pr}")
              sys.exit(1)
          print("Production RealFilesystem backend executed as root: >= 8 tests, zero skipped/failed/errored.")
